function sched(){const out=[],now=Date.now();for(let i=0;i<30;i++){const dt=new Date();dt.setDate(dt.getDate()+i);const date=ds(dt),L=evs(date);
 L.forEach(e=>{if(e.al<0)return;const t=new Date(dt.getFullYear(),dt.getMonth(),dt.getDate(),0,e.s-e.al).getTime();if(t>now)out.push({t,id:e.id+date,title:e.t,body:tm(e.s)+' to '+tm(e.e)+(e.loc?' at '+e.loc:'')})});
 const t=new Date(dt.getFullYear(),dt.getMonth(),dt.getDate(),7,55).getTime();if(L.length&&t>now)out.push({t,id:'sum'+date,title:'Today: '+L.length+' meeting'+(L.length>1?'s':''),body:L.slice(0,4).map(e=>tm(e.s)+' '+e.t).join(', ')})}
 return out.sort((a,b)=>a.t-b.t).slice(0,580)}
async function call(path,method,body){const key=localStorage.getItem(KK);if(!key)throw new Error('Add your access key in Settings.');const r=await fetch(WORKER_URL+path,{method,headers:{'Content-Type':'application/json','X-Access-Key':key},body:body?JSON.stringify(body):undefined});return{s:r.status,j:await r.json().catch(()=>({}))}}
async function sync(msg){try{const r=await call('/sync','POST',{state:S,schedule:sched()});return r.j.ok?'Synced '+new Date().toLocaleTimeString('en-GB'):'Not synced: '+(r.j.error||r.s)}catch(e){return'Not synced: '+e.message}}
function b64(s){const p='='.repeat((4-s.length%4)%4),r=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(r,c=>c.charCodeAt(0))}
async function enable(){try{if(!('serviceWorker'in navigator&&'PushManager'in window))return'Open this from the Home Screen icon (iOS 16.4 or later).';if(await Notification.requestPermission()!=='granted')return'Permission not granted.';const reg=await navigator.serviceWorker.register('sw.js');await navigator.serviceWorker.ready;let s=await reg.pushManager.getSubscription();if(!s)s=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64(PUBLIC_KEY)});const r=await call('/sync','POST',{subscription:s.toJSON(),state:S,schedule:sched()});return r.j.ok?'Notifications on.':'Worker said: '+(r.j.error||r.s)}catch(e){return'Could not enable: '+e.message}}
